spring:
  application:
    name: educare-backend
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
educare:
  security:
    jwt:
      expiration: 8h
# Documentação da API (OpenAPI e Swagger UI) desligada por padrão; só o dev liga.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
