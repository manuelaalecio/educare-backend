spring:
  application:
    name: educare-backend
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
educare:
  security:
    jwt:
      expiration: 8h
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  override-with-generic-response: false
  default-produces-media-type: application/json
