spring:
  application:
    name: educare-backend
  profiles:
    default: dev
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
educare:
  security:
    jwt:
      expiration: 8h
# Actuator: só o health é exposto na web, respondendo só o status agregado (spec security).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
# Documentação da API (OpenAPI e Swagger UI) desligada por padrão; só o dev liga.
# O documento gerado é o contrato versionado em openapi/educare-api.json (spec api-contract): ordem estável
# das chaves, só as respostas declaradas em cada operação (sem as inferidas do @RestControllerAdvice) e
# application/json nas respostas de sucesso, em vez de */* (os mappings não declaram produces).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  override-with-generic-response: false
  default-produces-media-type: application/json
