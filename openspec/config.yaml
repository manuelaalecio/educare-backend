schema: spec-driven

context: |
  ## Produto
  Educare é um sistema interno de uma ONG/instituição que atende crianças em situação
  de vulnerabilidade. Este backend guarda os dados e expõe a API usada pelo frontend.

  Objetivo: ajudar os funcionários da instituição a gerenciar o cadastro das crianças
  atendidas e seus responsáveis, e facilitar o período de rematrícula.

  Usuários: apenas funcionários da instituição. Crianças e responsáveis não acessam
  o sistema; são os dados gerenciados por ele.

  Escopo inicial:
  - Cadastro (CRUD) de crianças.
  - Cadastro (CRUD) de responsáveis e o vínculo entre crianças e responsáveis.
  - Cadastro (CRUD) de usuários (funcionários) e autenticação.
  - Rematrícula: existe uma janela de tempo (período de rematrícula) em que o cadastro
    de cada criança é revisado e renovado. O sistema deve tornar esse recadastro rápido,
    partindo dos dados já existentes em vez de cadastrar tudo de novo.

  Glossário (termo do negócio -> nome no código):
  - Criança -> Child
  - Responsável -> Guardian
  - Usuário / funcionário -> User
  - Matrícula -> Enrollment
  - Rematrícula -> Reenrollment
  - Período de rematrícula -> ReenrollmentPeriod

  Dados sensíveis (LGPD): o sistema trata dados pessoais de crianças e adolescentes,
  que exigem cuidado especial (LGPD, art. 14). Coletar só os dados necessários,
  restringir o acesso a usuários autenticados, nunca registrar dados pessoais em logs
  e manter trilha de quem criou ou alterou cada registro.

  ## Topologia
  - Dois serviços implantados separadamente: este backend (API REST) e um frontend
    (repositório próprio). Este repositório cobre apenas o backend.
  - O backend é stateless e se comunica com o frontend exclusivamente via HTTP/JSON.
  - Hospedagem: Oracle Cloud Free Tier, com CPU e memória limitadas. Evitar componentes
    de infraestrutura extras (Redis, Kafka, etc.) sem justificativa explícita no design.

  ## Stack
  - Java 21, Spring Boot 4.1.1, Gradle.
  - PostgreSQL 16, Spring Data JPA, Flyway. Lombok disponível.
  - Pacote raiz: com.manuelaalecio.educare_backend (com underscore).

  ## Arquitetura interna
  Estrutura detalhada, responsabilidades de cada camada, nomenclatura e exemplos
  estão no CLAUDE.md (seção "Arquitetura e estrutura do código"), que é a referência.
  Resumo das regras que o design deve respeitar:
  - Package-by-feature: cada pacote de primeiro nível é um módulo de negócio e
    corresponde a uma capability do OpenSpec. Camadas: api, application, domain,
    infrastructure. Código transversal fica em shared.
  - Dependências: api -> application -> domain; infrastructure -> domain.
  - Um módulo não acessa api/domain/infrastructure de outro; comunicação entre módulos
    só via services de application ou eventos de aplicação do Spring.
  - Controllers nunca expõem entidades; sempre DTOs.
  - Regras verificadas por testes ArchUnit.

  ## API
  - REST/JSON, prefixo versionado /api/v1.
  - Erros no formato RFC 9457 (ProblemDetail) via @RestControllerAdvice em shared.
  - Validação de entrada com Bean Validation nos DTOs.
  - Paginação padrão do Spring Data (page, size, sort) em listagens.
  - Documentação OpenAPI gerada pelo springdoc, publicada só no profile dev (/v3/api-docs e /swagger-ui/index.html, sem token).
  - CORS liberado apenas para a(s) origem(ns) do frontend, configuradas por variável de ambiente.

  ## Persistência
  - Schema gerenciado só pelo Flyway (src/main/resources/db/migration, V<n>__descricao.sql).
    spring.jpa.hibernate.ddl-auto=validate. Migrations aplicadas nunca são editadas.
  - Identificadores: UUID.
  - Colunas de auditoria (created_at, updated_at) nas tabelas de negócio; entidades estendem
    shared/persistence/BaseEntity.
  - Autoria (created_by, updated_by: id do usuário autenticado que criou e que alterou por
    último) em toda tabela de negócio, preenchida pela auditoria do Spring Data. Sem FK para
    users (excluir um usuário não apaga nem bloqueia a trilha). NOT NULL, salvo tabelas com
    linhas gravadas sem usuário autenticado (ex.: users, pelo admin da seed), com o motivo
    comentado na migration. Não aparece nas respostas da API.

  ## Segurança
  - Spring Security, API stateless autenticada por JWT (Bearer), validado pelo resource
    server do Spring Security.
  - Emissor próprio: o módulo auth emite o token no POST /api/v1/auth/login, a partir do
    login e da senha (BCrypt) do módulo user. Sem provedor externo.
  - Token JWT HS256 com validade de 8 horas e sem refresh token: expirou, faz login de novo.
    Claims só com iss, sub (id do usuário), iat e exp; nenhum dado pessoal nem a role.
  - A role é consultada no banco a cada requisição autenticada, então exclusão e mudança
    de role valem na requisição seguinte.
  - Rotas públicas: só POST /api/v1/auth/login e /actuator/health/**. Todo o resto exige
    token; 401 e 403 em ProblemDetail, sem indicar o motivo da recusa.
  - Autorização por role com @PreAuthorize no controller do módulo, não na filter chain
    em shared.
  - Chave do JWT (EDUCARE_JWT_SECRET, mínimo 32 bytes) e origens de CORS
    (EDUCARE_CORS_ALLOWED_ORIGINS, URLs http/https sem caminho, * recusado) por variável
    de ambiente: obrigatórias no prod, com padrão no dev.

  ## Configuração
  - application.yaml com profiles dev (padrão, aponta para o banco local do Compose) e prod;
    segredos só por variáveis de ambiente, e no prod também as URLs.
  - Actuator: health (com liveness/readiness) exposto para o healthcheck da VM/Compose.

  ## Testes
  Estratégia completa (tipos de teste, cobertura, convenções e estrutura) no CLAUDE.md,
  seção "Testes", que é a referência. Resumo do que afeta o planejamento:
  - Testes são obrigatórios; uma change só está concluída com ./gradlew build verde.
  - Tipos: unitário, web (@WebMvcTest), persistência (@DataJpaTest), cenário
    (@SpringBootTest + Testcontainers, um teste por Scenario das specs) e ArchUnit.
  - Cobertura JaCoCo mínima de 90% de linhas e branches, verificada no build.
  - O ./gradlew build roda no CI (.github/workflows/ci.yml) em todo PR para a main;
    o check build é obrigatório para o merge.

rules:
  proposal:
    - Incluir uma seção "Non-goals".
    - Indicar qual módulo (capability) é afetado; mudanças que atravessam módulos devem justificar.
  design:
    - Descrever endpoints (método, rota, status codes) e alterações de schema (migration Flyway).
    - Justificar qualquer nova dependência ou componente de infraestrutura, considerando os limites do Oracle Free Tier.
  specs:
    - Todo requirement tem ao menos um Scenario de sucesso e um de erro/borda.
    - Scenarios devem ser concretos e verificáveis (entradas, status HTTP e resultado esperados).
  tasks:
    - Toda task de código inclui seus testes (unitário e, quando houver endpoint, @WebMvcTest) na mesma task, não numa task separada no final.
    - Incluir uma task de testes de cenário cobrindo cada Scenario das specs da change.
    - A última task é rodar ./gradlew build com a verificação de cobertura do JaCoCo passando.
    - Mudanças de schema sempre como nova migration Flyway, nunca editando uma existente.
