plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.manuelaalecio'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

// Cobertura: ver a seção "Testes" do CLAUDE.md.
// Código gerado pelo Lombok é ignorado via lombok.config (@Generated).
def coverageExclusions = [
	'**/EducareBackendApplication.class',
	'**/dto/**',
	'**/shared/config/**',
]

def coverageClasses = files(sourceSets.main.output.classesDirs.files.collect {
	fileTree(dir: it, excludes: coverageExclusions)
})

jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(coverageClasses)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(coverageClasses)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Mutation testing (fora do build padrão): ./gradlew pitest
pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
		'com.manuelaalecio.educare_backend.*.domain.*',
		'com.manuelaalecio.educare_backend.*.application.*',
	]
	mutationThreshold = 80
	failWhenNoMutations = false
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
