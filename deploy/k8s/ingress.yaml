# API em HTTPS (entrypoint websecure do Traefik do k3s), só pelo host sslip.io: sem host, o acesso pelo IP
# puro dá 404. O certificado é emitido e renovado pelo cert-manager (ClusterIssuers de deploy/cert-manager,
# aplicados à mão) no Secret educare-backend-tls. O HTTP é redirecionado pelo Ingress educare-backend-http.
# Só a API: o Postgres nunca entra aqui.
#
# Emissão em duas etapas (README, "HTTPS"): primeiro letsencrypt-staging; só depois de o Certificate ficar
# Ready=True com o certificado de staging, trocar a anotação para letsencrypt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: educare-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 136-248-80-75.sslip.io
      secretName: educare-backend-tls
  rules:
    - host: 136-248-80-75.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educare-backend
                port:
                  number: 8080
