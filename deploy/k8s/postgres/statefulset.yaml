apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          # Major fixado: o 18 muda o PGDATA e exige migração deliberada.
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: app
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: educare-env
                  key: DB_PASSWORD
            # Subdiretório do volume, portável para storage em bloco (lost+found na raiz).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Por TCP (-h 127.0.0.1): durante o initdb o servidor temporário escuta só no socket.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # PVC do local-path (disco local da VM). Não é removido com o StatefulSet nem pelo prune do
  # Argo CD; excluir o PVC à mão apaga o banco (reclaimPolicy: Delete).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
