name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # On PRs a new push cancels the previous run; on main runs queue up, so every merge
  # with the `build` label gets its image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `build` id is the required check of the main branch protection: do not rename it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs also write their own cache (scoped to the PR); main runs write the shared one.
          cache-read-only: false

      - name: Build
        run: ./gradlew build

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/test-results/test/
          retention-days: 7

  # Allows publishing the image only when the merged PR has the `build` label.
  publish-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Check the build label of the merged pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" \
            | jq -c --arg sha "$COMMIT_SHA" \
              'first(.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)) // empty')
          if [ -z "$pr" ]; then
            publish=false
            reason="nenhum PR mergeado na main aponta para este commit"
          else
            number=$(jq -r '.number' <<< "$pr")
            if jq -e 'any(.labels[]; .name == "build")' <<< "$pr" > /dev/null; then
              publish=true
              reason="PR #$number tem o label \`build\`"
            else
              publish=false
              reason="PR #$number sem o label \`build\`"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "Imagem será publicada: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Imagem não publicada: $reason. Para publicar, adicione o label \`build\` ao PR e reexecute esta execução." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$publish ($reason)"

  image:
    needs: [build, publish-gate]
    if: needs.publish-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/educare-backend"
          short_sha="${COMMIT_SHA::7}"
          {
            echo "short_sha=$short_sha"
            echo "tags<<EOF"
            echo "$image:$short_sha"
            echo "$image:latest"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=$SERVER_URL/$REPOSITORY"
            echo "org.opencontainers.image.revision=$COMMIT_SHA"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: \`$image:$short_sha\` (e \`latest\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
