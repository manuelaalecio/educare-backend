name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # A `v*` tag is the release: it publishes the version image (see publish-gate).
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # On PRs a new push cancels the previous run; on main and on tags runs queue up, so every
  # merge with the `build` label and every release tag gets its image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `build` id is the required check of the main branch protection: do not rename it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs also write their own cache (scoped to the PR); main runs write the shared one.
          cache-read-only: false

      - name: Build
        run: ./gradlew build

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/test-results/test/
          retention-days: 7

  # Decides whether the image is published. On main: only when the merged PR has the
  # `build` label. On a `v*` tag: always, as long as the tag is `vX.Y.Z` and its commit is
  # on main (creating the tag is the explicit release act, so no label is needed).
  publish-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish || steps.tag-gate.outputs.publish }}
    steps:
      - name: Check the build label of the merged pull request
        id: gate
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" \
            | jq -c --arg sha "$COMMIT_SHA" \
              'first(.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)) // empty')
          if [ -z "$pr" ]; then
            publish=false
            reason="nenhum PR mergeado na main aponta para este commit"
          else
            number=$(jq -r '.number' <<< "$pr")
            if jq -e 'any(.labels[]; .name == "build")' <<< "$pr" > /dev/null; then
              publish=true
              reason="PR #$number tem o label \`build\`"
            else
              publish=false
              reason="PR #$number sem o label \`build\`"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "Imagem será publicada: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Imagem não publicada: $reason. Para publicar, adicione o label \`build\` ao PR e reexecute esta execução." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$publish ($reason)"

      - name: Checkout (full history, for the tag check)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the release tag
        id: tag-gate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            publish=false
            reason="a tag \`$TAG\` não segue o formato \`vX.Y.Z\`"
          elif ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            publish=false
            reason="o commit da tag \`$TAG\` não está na main"
          else
            publish=true
            reason="tag de versão \`$TAG\` num commit da main"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "Imagem será publicada: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Imagem não publicada: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$publish ($reason)"

  # Validates the Kubernetes manifests (deploy/k8s, rendered by Kustomize) and the Argo CD
  # resources (deploy/argocd) against the schemas of the cluster's Kubernetes version.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The CRDs-catalog covers the Traefik Middleware used by the HTTP->HTTPS redirect.
      - name: Validate deploy/k8s
        env:
          KUBERNETES_VERSION: 1.36.0
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default -schema-location "$CRD_SCHEMAS"

      # ClusterIssuers, applied by hand next to cert-manager (outside the Argo CD Application).
      - name: Validate deploy/cert-manager
        env:
          KUBERNETES_VERSION: 1.36.0
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" deploy/cert-manager/

      # The CRDs-catalog schema of ImageUpdater is from before v1.2 (it still requires
      # spec.namespace, removed in v1.2), so that kind is skipped here; image-updater.yaml
      # was checked against the CRD of the installed version (see design D3).
      - name: Validate deploy/argocd
        env:
          KUBERNETES_VERSION: 1.36.0
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" -skip ImageUpdater deploy/argocd/

  image:
    needs: [build, publish-gate, manifests]
    if: needs.publish-gate.outputs.publish == 'true'
    # Native arm64 runner: the cluster node is arm64, and building under QEMU is far slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/educare-backend"
          short_sha="${COMMIT_SHA::7}"
          tags=("$image:$short_sha" "$image:latest")
          # On a release tag (already validated by publish-gate), also the version tag.
          if [[ "$REF" == refs/tags/v* ]]; then
            tags+=("$image:$REF_NAME")
          fi
          {
            echo "short_sha=$short_sha"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=$SERVER_URL/$REPOSITORY"
            echo "org.opencontainers.image.revision=$COMMIT_SHA"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Imagem publicada (linux/arm64) com as tags:"
            printf -- "- \`%s\`\n" "${tags[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
